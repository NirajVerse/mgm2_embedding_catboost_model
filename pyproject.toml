[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgm2-embedding-model"
version = "0.1.0"
description = "Preparation and validation for paired original/MAPseq MGM2 embeddings"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "h5py>=3.8,<4",
  "catboost==1.2.10",
  "matplotlib>=3.6,<4",
]

[project.scripts]
mgm2-embedding-data = "mgm2_embedding_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
